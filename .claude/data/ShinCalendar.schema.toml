# ShinCalendar Schema Definition
# 定义日历系统表结构

[tables.memos]
columns = [
    { name = "id", type = "INTEGER", constraints = "PRIMARY KEY AUTOINCREMENT" },
    { name = "content", type = "TEXT", constraints = "NOT NULL" },
    { name = "start_time", type = "TEXT", constraints = "NOT NULL" },
    { name = "end_time", type = "TEXT" },
    { name = "is_deleted", type = "INTEGER", constraints = "DEFAULT 0" }
]

[tables.tags]
columns = [
    { name = "id", type = "INTEGER", constraints = "PRIMARY KEY AUTOINCREMENT" },
    { name = "name", type = "TEXT", constraints = "UNIQUE NOT NULL" }
]

[tables.memo_tags]
columns = [
    { name = "memo_id", type = "INTEGER" },
    { name = "tag_id", type = "INTEGER" },
    { name = "constraints", type = "FOREIGN KEY(memo_id) REFERENCES memos(id) ON DELETE CASCADE, FOREIGN KEY(tag_id) REFERENCES tags(id) ON DELETE CASCADE" }
]
