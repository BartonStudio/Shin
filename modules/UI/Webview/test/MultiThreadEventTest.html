<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shin UI Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333333;
            border-radius: 6px;
            font-size: 14px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <h1>Shin UI Engine Test</h1>
    <div class="status" id="status">Frontend resources are ready.</div>
    <div id="eventData" style="margin-top: 20px; font-size: 16px; color: #ffca28;">Waiting for C++ events...</div>
    <button id="testBtn" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">Send to C++</button>

    <script>
        // 1. Listen for messages from C++ via native PostWebMessageAsJson
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function(event) {
                const data = event.data;
                if (data && typeof data === 'object') {
                    if (data.type === 'UpdateStatus') {
                        document.getElementById('status').innerText = data.message;
                    } else if (data.type === 'SystemInfo') {
                        document.getElementById('eventData').innerText = 
                            "Received System Info - CPU: " + data.cpu + "%, RAM: " + data.ram;
                    }
                }
            });
        }

        // 2. JS calls C++
        document.getElementById('testBtn').addEventListener('click', function() {
            if (window.cppLog) {
                window.cppLog("Hello from JS Button!").then(res => {
                    console.log("C++ Response:", res);
                });
            }
        });
    </script>
</body>
</html>
